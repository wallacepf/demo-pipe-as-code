pipeline:
  name: todo-api-ci-pipeline
  identifier: todoapi_ci
  projectIdentifier: Demo_Quinto_Andar
  orgIdentifier: default
  tags:
    app: todo-api
    team: platform-engineering

  # Monorepo layout: this pipeline only builds apps/todo-api.
  # Other apps/services in this repo have (or will have) their own pipeline under .harness/ci/.
  properties:
    ci:
      codebase:
        connectorRef: org.Personal_GH
        repoName: demo-pipe-as-code
        build: <+input>

  stages:
    # Stage 1: Build and Test (Developer Journey)
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            PIP_CACHE_DIR: /root/.cache/pip
          # Self-managed build infra: runs on the org-level Kubernetes cluster
          # connector, reached through harness-delegate.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kindcluster
              namespace: dev-env-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux

          # Cache Intelligence: pip has no default-path auto-detection in
          # Cache Intelligence (Maven/Gradle/Bazel/Yarn/Go/.NET only), so the
          # pip cache dir is declared explicitly, keyed off requirements.txt.
          caching:
            enabled: true
            key: cache-{{ checksum "apps/todo-api/requirements.txt" }}
            paths:
              - /root/.cache/pip

          # Build Intelligence is Maven/Gradle/Bazel-specific and doesn't
          # apply to Python builds, so it's omitted here.

          # CI Steps
          execution:
            steps:
              # Step 1: Run Tests with Test Intelligence. Java's mvn test
              # was OOM-ing on this Kubernetes infra (JVM heap under the pod's
              # memory limits); pytest's per-test-process footprint is far
              # lighter, which is the whole point of this migration.
              - step:
                  type: Test
                  name: Run Unit and Integration Tests
                  identifier: run_tests
                  spec:
                    language: Python
                    buildTool: Pytest
                    runOnlySelectedTests: true
                    connectorRef: org.Docker_Hub_Anom
                    image: python:3.12-slim
                    shell: Sh
                    command: |
                      pip install -r apps/todo-api/requirements.txt -r apps/todo-api/requirements-test.txt
                      cd apps/todo-api
                      pytest --junitxml=test-results/junit.xml
                    intelligenceMode: true
                    envVariables:
                      PIP_CACHE_DIR: /root/.cache/pip
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "test-results/junit.xml"

              # Step 2: Build and Push Docker Image to Harness Artifact Registry (HAR)
              # Only runs on Push builds (merge to main), not on PR builds,
              # to avoid publishing an image for every pull request.
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_and_push_image
                  spec:
                    # Native HAR integration: registryRef points directly at the
                    # project-scoped HAR Docker registry, no connector needed.
                    registryRef: demo-registry
                    repo: todo-api
                    dockerfile: apps/todo-api/Dockerfile
                    context: apps/todo-api
                    tags:
                      - <+pipeline.sequenceId>

                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "Push"
