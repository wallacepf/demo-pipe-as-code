pipeline:
  name: todo-api-ci-pipeline
  identifier: todoapi_ci
  projectIdentifier: Demo_Quinto_Andar
  orgIdentifier: default
  tags:
    app: todo-api
    team: platform-engineering

  # Monorepo layout: this pipeline only builds apps/todo-api.
  # Other apps/services in this repo have (or will have) their own pipeline under .harness/ci/.
  properties:
    ci:
      codebase:
        connectorRef: Personal_GH
        repoName: demo-pipe-as-code
        build: <+input>

  stages:
    # Stage 1: Build and Test (Developer Journey)
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true

          # Self-managed build infra: runs on the org-level Kubernetes cluster
          # connector, reached through harness-delegate.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kindcluster
              namespace: dev-env-ci

          # NOTE: Cache Intelligence intentionally left out. On self-managed
          # Kubernetes infra it requires a default object storage connector
          # (S3/GCS/Azure Blob) configured in Default Settings, which we
          # don't have yet. Re-add once an S3 bucket/connector is available.

          # CI Steps
          execution:
            steps:
              # Step 1: Run Tests with Test Intelligence
              - step:
                  type: RunTests
                  name: Run Unit and Integration Tests
                  identifier: run_tests
                  spec:
                    image: maven:3.9-eclipse-temurin-17
                    language: Java
                    buildTool: Maven
                    workingDirectory: apps/todo-api
                    args: clean test
                    runOnlySelectedTests: true # Test Intelligence enabled
                    preCommand: |
                      echo "Running tests with Harness Test Intelligence"
                      echo "Only changed and affected tests will be executed"
                    postCommand: |
                      echo "Test execution completed"
                      echo "Test reports available in apps/todo-api/target/surefire-reports"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "apps/todo-api/target/surefire-reports/*.xml"
                    # Test Intelligence Configuration
                    intelligenceMode: true
                    enableTestSplitting: false

                  # Failure strategy
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsFailure

              # Step 2: Build Application
              - step:
                  type: Run
                  name: Build Application
                  identifier: build_app
                  spec:
                    image: maven:3.9-eclipse-temurin-17
                    shell: Bash
                    workingDirectory: apps/todo-api
                    command: |
                      echo "Building application with Maven"
                      mvn clean package -DskipTests -B

                      echo "Build completed successfully"
                      ls -lh target/*.jar

                    # Environment variables
                    envVariables:
                      MAVEN_OPTS: "-Xmx1024m"

                  # When condition - only if tests passed
                  when:
                    stageStatus: Success

              # NOTE: Build and Push Docker Image step intentionally left out.
              # No push-capable registry connector is available yet (Harness
              # Artifact Registry is not licensed on this account). Add the
              # BuildAndPushDockerRegistry step back once the registry/license
              # is available.

  # Pipeline Variables
  variables:
    - name: APP_NAME
      type: String
      description: Application name
      value: todo-api

    - name: JAVA_VERSION
      type: String
      description: Java version
      value: "17"

    - name: MAVEN_VERSION
      type: String
      description: Maven version
      value: "3.9"

  # Notification rules
  notificationRules:
    - name: Pipeline Failure Notification
      identifier: pipeline_failure
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Email
        spec:
          userGroups:
            - _project_all_users
          recipients:
            - <+pipeline.triggeredBy.email>
