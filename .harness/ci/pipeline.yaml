pipeline:
  name: todo-api-ci-pipeline
  identifier: todoapi_ci
  projectIdentifier: Demo_Quinto_Andar
  orgIdentifier: default
  tags:
    app: todo-api
    team: platform-engineering

  # Monorepo layout: this pipeline only builds apps/todo-api.
  # Other apps/services in this repo have (or will have) their own pipeline under .harness/ci/.
  properties:
    ci:
      codebase:
        connectorRef: org.Personal_GH
        repoName: demo-pipe-as-code
        build: <+input>

  stages:
    # Stage 1: Build and Test (Developer Journey)
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true

          # Self-managed build infra: runs on the org-level Kubernetes cluster
          # connector, reached through harness-delegate.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kindcluster
              namespace: dev-env-ci

          # Cache Intelligence: connector/bucket/region come from Default
          # Settings (org connector org.aws_wallace_account, bucket name and
          # region overridden at Project scope), so no inline overrides needed here.
          caching:
            enabled: true

          # Build Intelligence: reuses the same object storage Default Settings
          # as Cache Intelligence (org.aws_wallace_account) since there is no
          # separate connector/bucket setting for ci_build_intel_*. Supported
          # for Maven (3.9+) on Kubernetes self-hosted infra.
          buildIntelligence:
            enabled: true

          # CI Steps
          execution:
            steps:
              # Step 1: Run Tests with Test Intelligence
              - step:
                  type: RunTests
                  name: Run Unit and Integration Tests
                  identifier: run_tests
                  spec:
                    connectorRef: org.Docker_Hub_Anom
                    image: maven:3.9-eclipse-temurin-17
                    language: Java
                    buildTool: Maven
                    workingDirectory: apps/todo-api
                    args: clean test
                    runOnlySelectedTests: true # Test Intelligence enabled
                    preCommand: |
                      echo "Running tests with Harness Test Intelligence"
                      echo "Only changed and affected tests will be executed"
                    postCommand: |
                      echo "Test execution completed"
                      echo "Test reports available in apps/todo-api/target/surefire-reports"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - "apps/todo-api/target/surefire-reports/*.xml"
                    enableTestSplitting: false

              # Step 2: Build Application
              - step:
                  type: Run
                  name: Build Application
                  identifier: build_app
                  spec:
                    connectorRef: org.Docker_Hub_Anom
                    image: maven:3.9-eclipse-temurin-17
                    shell: Bash
                    workingDirectory: apps/todo-api
                    command: |
                      echo "Building application with Maven"
                      mvn clean package -DskipTests -B

                      echo "Build completed successfully"
                      ls -lh target/*.jar

                    # Environment variables
                    envVariables:
                      MAVEN_OPTS: "-Xmx1024m"

                  # When condition - only if tests passed
                  when:
                    stageStatus: Success

              # Step 3: Build and Push Docker Image to Harness Artifact Registry (HAR)
              # Only runs on Push builds (merge to main), not on PR builds,
              # to avoid publishing an image for every pull request.
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_and_push_image
                  spec:
                    # Native HAR integration: registryRef points directly at the
                    # project-scoped HAR Docker registry, no connector needed.
                    registryRef: demo-registry
                    repo: todo-api
                    dockerfile: apps/todo-api/Dockerfile
                    context: apps/todo-api
                    tags:
                      - <+pipeline.sequenceId>

                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "Push"
