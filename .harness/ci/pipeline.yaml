pipeline:
  name: todo-api-ci-pipeline
  identifier: todoapi_ci
  projectIdentifier: Demo_Quinto_Andar
  orgIdentifier: default
  tags:
    app: todo-api
    team: platform-engineering
  properties:
    ci:
      codebase:
        connectorRef: org.Personal_GH
        repoName: demo-pipe-as-code
        build:
          type: branch
          spec:
            branch: main
  stages:
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: org.kindcluster
              namespace: dev-env-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          caching:
            enabled: true
            key: cache-{{ checksum "apps/todo-api/requirements.txt" }}
            paths:
              - /harness/.cache/pip
          execution:
            steps:
              - step:
                  type: Test
                  name: Run Unit and Integration Tests
                  identifier: run_tests
                  spec:
                    language: Python
                    buildTool: Pytest
                    runOnlySelectedTests: true
                    connectorRef: org.Docker_Hub_Anom
                    image: python:3.12-slim
                    shell: Sh
                    command: |
                      pip install -r apps/todo-api/requirements.txt -r apps/todo-api/requirements-test.txt
                      cd apps/todo-api
                      pytest --junitxml=test-results/junit.xml
                    intelligenceMode: true
                    envVariables:
                      PIP_CACHE_DIR: /harness/.cache/pip
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - test-results/junit.xml
              - stepGroup:
                  name: Security Gate
                  identifier: Security_Gate
                  template:
                    templateRef: CI_Security_Gates
                    versionLabel: "1.0"
                    gitBranch: main
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_and_push_image
                  spec:
                    registryRef: demo-registry
                    repo: todo-api
                    dockerfile: apps/todo-api/Dockerfile
                    context: apps/todo-api
                    tags:
                      - <+pipeline.sequenceId>
                  when:
                    stageStatus: Success
                    condition: <+codebase.build.type> == "Push"
